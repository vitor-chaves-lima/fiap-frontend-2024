<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="text-center mt-5">
        <h1>Formulário</h1>
        <p class="lead">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Delectus
          ipsam accusantium praesentium numquam perspiciatis at non atque
          blanditiis, pariatur reiciendis quo maiores incidunt, quod voluptate
          debitis, esse earum ad est?
        </p>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-8">
          <form class="needs-validation" novalidate>
            <div class="row">
              <div class="col-md-6">
                <label for="name-input" class="form-label">Nome</label>
                <input
                  type="text"
                  name="name-input"
                  id="name"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="last-name-input" class="form-label"
                  >Sobrenome</label
                >
                <input
                  type="text"
                  name="last-name-input"
                  id="last-name"
                  class="form-control"
                />
              </div>
            </div>

            <div class="row">
              <div class="col-12">
                <label for="email-input" class="form-label">E-mail</label>
                <input
                  type="email"
                  name="email-input"
                  id="email"
                  class="form-control"
                />
              </div>
            </div>

            <div class="row">
              <div class="col-md-3">
                <label for="cep-input" class="form-label">CEP</label>
                <input
                  type="text"
                  name="cep-input"
                  id="cep"
                  class="form-control"
                />
              </div>

              <div class="col-md-7">
                <label for="address-input" class="form-label">Endereço</label>
                <input
                  type="text"
                  name="address-input"
                  id="address"
                  class="form-control"
                />
              </div>

              <div class="col-md-2">
                <label for="address-number-input" class="form-label"
                  >Número</label
                >
                <input
                  type="text"
                  name="address-number-input"
                  id="address-number"
                  class="form-control"
                />
              </div>
            </div>

            <div class="row">
              <div class="col-md-3">
                <label for="country-input" class="form-label">País</label>
                <select
                  type="text"
                  name="country-input"
                  id="country"
                  class="form-select"
                >
                  <option value="" selected disabled>Selecione</option>
                  <option value="br">Brasil</option>
                  <option value="us">Estados Unidos</option>
                </select>
              </div>

              <div class="col-md-3">
                <label for="city-input" class="form-label">Cidade</label>
                <select
                  type="text"
                  name="city-input"
                  id="city"
                  class="form-select"
                >
                  <option value="" selected disabled>Selecione</option>
                  <option value="sp">São Paulo</option>
                  <option value="rj">Rio de Janeiro</option>
                </select>
              </div>
            </div>

            <hr class="my-4" />

            <div class="form-check">
              <input
                type="checkbox"
                name="alma"
                id="alma"
                class="form-check-input"
                required
              />
              <label for="alma" class="form-check-label"
                >Aceito as políticas de segurança...</label
              >
            </div>

            <hr class="my-4" />

            <button type="submit" class="btn btn-primary w-100">
              Finalizar
            </button>
          </form>
        </div>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        // Fetch all the forms we want to apply custom Bootstrap validation styles to
        const forms = document.querySelectorAll(".needs-validation");

        // Loop over them and prevent submission
        Array.from(forms).forEach((form) => {
          form.addEventListener(
            "submit",
            (event) => {
              if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
              }

              form.classList.add("was-validated");
            },
            false
          );
        });
      })();
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
