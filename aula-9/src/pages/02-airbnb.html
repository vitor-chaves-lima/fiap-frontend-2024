<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airbnb</title>

    <link rel="stylesheet" href="../../public/css/02-airbnb.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="box-title">
        <h1>Cabana do Sossego Refúgio na Serra da Mantiqueira</h1>

        <div class="container-links">
          <a href="#">
            <img
              src="../../public/assets/svg/share-icon.svg"
              alt="Share icon"
              class="btn-icon"
            />
            <span>Compartilhar</span>
          </a>

          <a href="#">
            <img
              src="../../public/assets/svg/heart-icon.svg"
              alt="Heart icon"
              class="btn-icon"
            />
            <span>Salvar</span>
          </a>
        </div>
      </div>
      <div class="images-grid">
        <div class="img-acomodacao-1">
          <img
            src="../../public/assets/images/image-1.webp"
            alt="Imagem acomodação 1"
          />
        </div>
        <div class="img-acomodacao-2">
          <img
            src="../../public/assets/images/image-2.webp"
            alt="Imagem acomodação 2"
          />
        </div>
        <div class="img-acomodacao-3">
          <img
            src="../../public/assets/images/image-3.webp"
            alt="Imagem acomodação 3"
          />
        </div>
        <div class="img-acomodacao-4">
          <img
            src="../../public/assets/images/image-4.webp"
            alt="Imagem acomodação 4"
          />
        </div>
        <div class="img-acomodacao-5">
          <img
            src="../../public/assets/images/image-5.webp"
            alt="Imagem acomodação 5"
          />
        </div>
      </div>
    </div>
  </body>
</html>
